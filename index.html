<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pointfix</title>
  <meta name="description" content="Point at your UI, and your own Claude Code or Codex fixes the code.">
  <style>
    :root { --bg: #f8fafc; --text: #0f172a; --muted: #475569; --accent: #2563eb; --code: #e2e8f0; }
    @media (prefers-color-scheme: dark) { :root { --bg: #020617; --text: #e2e8f0; --muted: #94a3b8; --accent: #60a5fa; --code: #1e293b; } }
    body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 640px; margin: 0 auto; padding: 72px 16px; }
    img { width: 72px; height: 72px; border-radius: 16px; }
    h1 { font-size: 34px; margin: 16px 0 8px; }
    p { color: var(--muted); }
    code { font: 15px ui-monospace, Menlo, monospace; background: var(--code); padding: 2px 6px; border-radius: 5px; color: var(--text); }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <img src="icon128.png" alt="">
    <h1>Pointfix</h1>
    <p>Point at any element on a page, say what to change, and your own Claude Code or Codex edits the code. Free, and it uses your existing subscription.</p>
    <p>Set up the local helper with <code>npx pointfix install</code>.</p>
    <p><a href="privacy.html">Privacy policy</a></p>
  </main>
</body>
</html>
