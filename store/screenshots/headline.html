<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 800px; overflow: hidden; }
  body {
    background: linear-gradient(135deg, #1e40af 0%, #2563eb 55%, #3b82f6 100%);
    font-family: -apple-system, "SF Pro Display", system-ui, sans-serif;
    color: #fff;
    display: flex;
    align-items: center;
    padding: 0 64px 0 80px;
    gap: 56px;
  }
  .copy { flex: 1; }
  .brand { display: flex; align-items: center; gap: 16px; margin-bottom: 36px; }
  .brand img { width: 64px; height: 64px; border-radius: 15px; box-shadow: 0 6px 18px rgba(15, 23, 42, 0.35); }
  .brand span { font-size: 34px; font-weight: 700; letter-spacing: -0.5px; }
  h1 { font-size: 54px; line-height: 1.1; font-weight: 800; letter-spacing: -1.2px; margin-bottom: 28px; }
  ul { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 16px; }
  li { font-size: 23px; line-height: 1.35; color: #dbeafe; display: flex; gap: 12px; }
  li::before { content: "✓"; color: #fde047; font-weight: 800; }
  .shot { flex: none; height: 760px; filter: drop-shadow(0 24px 40px rgba(15, 23, 42, 0.45)); }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand"><img src="../../extension/icons/icon128.png" alt=""><span>Pointfix</span></div>
    <h1>Point at your UI.<br>Your AI fixes the code.</h1>
    <ul>
      <li>Sends the exact element to Claude Code or Codex</li>
      <li>See the diff and before&#8202;/&#8202;after screenshots</li>
      <li>Undo any change with one click</li>
      <li>Free: uses your own subscription</li>
    </ul>
  </div>
  <img class="shot" src="panel.png" alt="">
</body>
</html>
